framework:
    secret: '%env(APP_SECRET)%'
    https_detection: false
    http_method_override: false
    handle_all_throwables: true

    php_errors:
        log: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: 'session.storage.factory.native'
        cookie_path: '/'
        cookie_lifetime: 0

    router:
        utf8: true

    translator: { fallbacks: [en] }

    test: ~
